<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynn Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@300;400&family=Noto+Sans+SC:wght@100;200;300&family=Noto+Sans+KR:wght@100;200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="portfolio-gate.css">
  <link rel="stylesheet" href="site-nav.css">
  <link rel="stylesheet" href="portfolio.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body>
  <div class="portfolio-loading" id="portfolio-loading">正在加载作品集 …</div>

  <div class="portfolio-app" id="portfolio-app" hidden>
    <header class="site-nav-shell" id="site-nav-shell">
      <nav class="portfolio-nav" id="portfolio-nav"></nav>
    </header>

    <section class="portfolio-hero-archive" id="portfolio-hero-archive" aria-label="Profile archive"></section>

    <section class="portfolio-hero-role-cta" id="portfolio-hero-role-cta" aria-label="Portfolio introduction"></section>

    <main>
      <section class="portfolio-work" id="work" aria-labelledby="work-heading"></section>
    </main>

    <footer class="portfolio-footer" id="contact"></footer>
  </div>

  <div class="portfolio-gate" id="portfolio-gate" hidden>
    <div class="portfolio-gate__backdrop" data-portfolio-gate-close aria-hidden="true"></div>
    <div
      class="portfolio-gate__dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="portfolio-gate-title"
      aria-describedby="portfolio-gate-desc"
    >
      <button type="button" class="portfolio-gate__close" id="portfolio-gate-close" aria-label="Close">×</button>
      <h2 class="portfolio-gate__title" id="portfolio-gate-title">Private Portfolio</h2>
      <p class="portfolio-gate__desc" id="portfolio-gate-desc">Please enter the password to view my portfolio.</p>
      <form class="portfolio-gate__form" id="portfolio-gate-form">
        <label class="portfolio-gate__field">
          <span class="visually-hidden">Password</span>
          <input
            type="password"
            id="portfolio-gate-password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >
        </label>
        <p class="portfolio-gate__error" id="portfolio-gate-error" hidden>密码不正确，请重新输入</p>
        <button type="submit" class="portfolio-gate__submit">Enter</button>
      </form>
    </div>
  </div>

  <script src="js/dom-safe.js"></script>
  <script src="js/portfolio-gate.js"></script>
  <script src="js/site-nav.js"></script>
  <script src="js/projects-shared.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
